<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project 1 — Class Timer</title>
<style>
  :root{ --bg:#0B0E14; --panel:#151B26; --neon:#00ff41; --ink:#F5F7FA; --muted:#8A94A6; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);
    color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:32px 24px;gap:28px}
  .kicker{font-family:'Courier New',monospace;color:var(--neon);letter-spacing:.18em;
    font-weight:700;font-size:clamp(12px,1.4vw,16px);text-transform:uppercase}
  h1{font-size:clamp(22px,3vw,36px);text-align:center}
  #phase{font-size:clamp(28px,5vw,64px);font-weight:800;text-align:center;color:var(--neon)}
  #detail{font-size:clamp(15px,1.8vw,22px);color:var(--muted);text-align:center;max-width:900px;line-height:1.5}
  #clock{font-family:'Courier New',monospace;font-size:clamp(64px,14vw,180px);font-weight:700;
    line-height:1;font-variant-numeric:tabular-nums}
  #clock.warn{color:#ffb020}#clock.crit{color:#ff4141;animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:.35}}
  .bar{width:min(1100px,92vw);height:10px;background:var(--panel);border-radius:5px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--neon);width:0%}
  ol{list-style:none;width:min(1100px,92vw);display:flex;flex-direction:column;gap:8px}
  li{display:flex;gap:14px;align-items:baseline;background:var(--panel);border-radius:10px;
    padding:12px 18px;font-size:clamp(14px,1.6vw,20px);border-left:4px solid transparent}
  li .t{font-family:'Courier New',monospace;color:var(--muted);min-width:8.5em}
  li.done{opacity:.38}li.done .name{text-decoration:line-through}
  li.now{border-left-color:var(--neon)}li.now .name{color:var(--neon);font-weight:700}
  li .hint{color:var(--muted);font-size:.85em;margin-left:auto;text-align:right}
  footer{color:var(--muted);font-family:'Courier New',monospace;font-size:13px;margin-top:auto}
</style>
</head>
<body>
  <div>
    <div class="kicker" style="text-align:center">Project 1 · Fake It, Then Make It</div>
    <h1>Today: one loop, then build — share-out before lunch</h1>
  </div>
  <div id="phase">—</div>
  <div id="detail"></div>
  <div id="clock">--:--</div>
  <div class="bar"><i id="fill"></i></div>
  <ol id="plan"></ol>
  <footer>TECHIE 1121 · Bloomberg 061 · timer runs on wall-clock time — reloading is safe</footer>

<script>
// Phases end at fixed wall-clock times (today, 9:50–12:00).
const PHASES = [
  {end:"10:05", name:"1 · Brainstorm",        detail:"Diverge! Problems from YOUR lives, many ideas fast — then pick one your team actually wants."},
  {end:"10:20", name:"2 · GitHub + document", detail:"Accept the team assignment (link on the course site), everyone joins the repo, write your idea into project-report.md (The Vibe section)."},
  {end:"10:50", name:"3 · Fake it",           detail:"AI-build ONLY the quick interactive parts. Everything missing: act it out — a teammate plays the app (Wizard of Oz)."},
  {end:"11:05", name:"4 · Test & decide",     detail:"Swap with a neighboring team. Act the full flow, watch what they DO. Then decide: right thing? Re-scope, fill in the fake-it loop in your report."},
  {end:"11:45", name:"5 · Engineer",          detail:"Build the re-scoped app for real. Split roles: who designs, who orchestrates the AI, who architects. Co-design with the AI — make it argue."},
  {end:"12:00", name:"6 · Share-out",         detail:"Every team, 90 seconds: what you faked, what the test changed, what you're building. Then: lunch!"},
];
const START = "09:50";

const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const planEl = document.getElementById("plan");
PHASES.forEach((p,i) => {
  const from = i === 0 ? START : PHASES[i-1].end;
  const li = document.createElement("li");
  li.innerHTML = `<span class="t">${from}–${p.end}</span><span class="name">${p.name}</span>` +
                 `<span class="hint">${toMin(p.end)-toMin(from)} min</span>`;
  planEl.appendChild(li);
});

let lastPhase = -1;
function beep(){ try{
  const c = new (window.AudioContext||window.webkitAudioContext)();
  const o = c.createOscillator(), g = c.createGain();
  o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .12;
  o.start(); o.stop(c.currentTime + .35);
}catch(e){} }

function tick(){
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  const idx = PHASES.findIndex(p => nowMin < toMin(p.end));
  const items = planEl.children;
  for (let i=0;i<items.length;i++){
    items[i].className = idx === -1 || i < idx ? "done" : (i === idx ? "now" : "");
  }
  const phaseEl = document.getElementById("phase"), detailEl = document.getElementById("detail"),
        clockEl = document.getElementById("clock"), fill = document.getElementById("fill");
  if (idx === -1){
    phaseEl.textContent = "🎉 Lunch!";
    detailEl.textContent = "Office hours over the break — bring your questions.";
    clockEl.textContent = "00:00"; clockEl.className = ""; fill.style.width = "100%";
    return;
  }
  if (idx !== lastPhase && lastPhase !== -1) beep();
  lastPhase = idx;
  const p = PHASES[idx];
  const from = idx === 0 ? toMin(START) : toMin(PHASES[idx-1].end);
  const left = toMin(p.end) - nowMin;
  const mm = Math.floor(left), ss = Math.floor((left-mm)*60);
  phaseEl.textContent = p.name;
  detailEl.textContent = p.detail;
  clockEl.textContent = String(mm).padStart(2,"0") + ":" + String(ss).padStart(2,"0");
  clockEl.className = left <= 1 ? "crit" : (left <= 3 ? "warn" : "");
  fill.style.width = Math.min(100, Math.max(0, (nowMin-from)/(toMin(p.end)-from)*100)) + "%";
}
tick(); setInterval(tick, 250);
</script>
</body>
</html>
